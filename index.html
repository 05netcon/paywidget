<script src="https://unpkg.com/style-scoped/scoped.min.js"></script>
<script
    src="https://securepay.tinkoff.ru/html/payForm/js/tinkoff_v2.js">
</script>
<div>
    <style scoped>
        @import "https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css";
        @import "style.css";
    </style>
    <div id="purchase-panel">
        <form
            name="tinkoffPayForm"
            onsubmit="pay(this); return false;"
            class="box p-0 m-0 is-shadowless">
            <div class="field mb-4">
                <label class="label is-small has-text-weight-light">
                    Наименование тура
                </label>
                <div class="control is-expanded">
                    <div class="select is-fullwidth">
                        <select></select>
                    </div>
                </div>
            </div>
            <div class="field mb-4">
                <label class="label is-small has-text-weight-light">
                    Количество взрослых
                </label>
                <div class="field is-grouped is-flex is-align-items-center">
                    <p class="control is-expanded">
                        <input
                            class="is-clickable"
                            type="range"
                            name="adult-count"
                            min="1"
                            max="18"
                            value="1">
                    </p>
                    <p class="control">
                        <span class="tag is-info">01</span>
                    </p>
                </div>
            </div>
            <div class="field mb-4">
                <label class="label is-small has-text-weight-light">
                    Количество детей
                </label>
                <div class="field is-grouped is-flex is-align-items-center">
                    <p class="control is-expanded">
                        <input
                            class="is-clickable"
                            type="range"
                            name="child-count"
                            min="0"
                            max="18"
                            value="0">
                    </p>
                    <p class="control">
                        <span class="tag is-info">00</span>
                    </p>
                </div>
            </div>
            <div class="field mb-0">
                <label class="label is-small has-text-weight-light">
                    Итоговая цена
                </label>
                <div class="field is-grouped">
                    <p class="control is-expanded">
                        <input class="input" type="number" step="100">
                    </p>
                    <p class="control">
                        <button
                            class="button is-primary has-text-weight-normal"
                            type="submit">
                            Оплатить
                        </button>
                    </p>
                </div>
            </div>
            <input type="hidden" name="terminalkey">
            <input type="hidden" name="frame">
            <input type="hidden" name="language">
            <input type="hidden" name="description">
            <input type="hidden" name="amount">
        </form>
    </div>
</div>
<script type="module" src="app.js"></script>
